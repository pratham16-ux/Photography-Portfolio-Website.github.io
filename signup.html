<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up | Stackly Photography</title>
<link rel="icon" href="https://wsrv.nl/?url=https://snabsolutions.in/wp-content/uploads/2026/02/stackly-snab-solutions.png&w=280&output=webp&q=85&fit=cover&tint=D4AF37">
<link rel="stylesheet" href="assets/style.css">
<style>
  .auth-wrap{min-height:100svh;display:flex;align-items:center;justify-content:center;background:var(--ink);padding:40px 20px;}
  .auth-box{width:100%;max-width:420px;background:var(--charcoal);border:1px solid var(--line);border-radius:14px;padding:40px 32px;box-shadow:var(--shadow-dark);}
  .auth-logo{text-align:center;margin-bottom:22px;}
  .auth-logo img{height:44px;}
  .auth-title{color:var(--ivory);font-family:var(--ff-serif);font-size:26px;text-align:center;margin-bottom:4px;}
  .auth-sub{color:var(--stone);text-align:center;font-size:13px;margin-bottom:24px;}
  .auth-field{margin-bottom:18px;}
  .auth-field label{display:block;color:var(--stone);font-size:12px;letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px;}
  .auth-field input{width:100%;padding:12px 14px;background:var(--charcoal-2);border:1px solid var(--line);border-radius:8px;color:var(--ivory);font-family:var(--ff-sans);font-size:15px;outline:none;transition:.2s;}
  .auth-field input:focus{border-color:var(--gold);}
  .auth-err{color:#e8746a;font-size:12px;margin-top:6px;display:none;}
  .auth-err.show{display:block;}
  .auth-submit{width:100%;padding:14px;background:var(--gold);color:var(--ink);border:none;border-radius:8px;font-family:var(--ff-sans);font-weight:600;letter-spacing:.03em;cursor:pointer;margin-top:6px;transition:.25s var(--ease);}
  .auth-submit:hover{background:var(--gold-light);}
  .auth-alt{color:var(--stone);font-size:13px;text-align:center;margin-top:20px;}
  .auth-alt a{color:var(--gold-light);text-decoration:none;font-weight:600;}
  .auth-alt a:hover{text-decoration:underline;}
  .auth-back{display:block;text-align:center;color:var(--stone);font-size:13px;margin-top:16px;text-decoration:none;}
  .auth-back:hover{color:var(--gold-light);}
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-box">
    <div class="auth-logo"><img src="https://wsrv.nl/?url=https://snabsolutions.in/wp-content/uploads/2026/02/stackly-snab-solutions.png&w=280&output=webp&q=85&fit=cover&tint=D4AF37" alt="Stackly Photography"></div>
    <h1 class="auth-title">Create Account</h1>
    <p class="auth-sub">Sign up to view your galleries and bookings</p>

    <form id="signupForm" novalidate>
      <div class="auth-field">
        <label for="suName">Full Name</label>
        <input type="text" id="suName" placeholder="e.g. Aarav Sharma" autocomplete="name">
        <div class="auth-err" id="nameErr"></div>
      </div>
      <div class="auth-field">
        <label for="suEmail">Email</label>
        <input type="email" id="suEmail" placeholder="you@example.com" autocomplete="email">
        <div class="auth-err" id="emailErr"></div>
      </div>
      <div class="auth-field">
        <label for="suPhone">Mobile Number</label>
        <input type="tel" id="suPhone" placeholder="10-digit mobile number" maxlength="10" inputmode="numeric" autocomplete="tel">
        <div class="auth-err" id="phoneErr"></div>
      </div>
      <div class="auth-field">
        <label for="suPass">Password</label>
        <input type="password" id="suPass" placeholder="Minimum 6 characters" autocomplete="new-password">
        <div class="auth-err" id="passErr"></div>
      </div>
      <div class="auth-field">
        <label for="suConfirm">Confirm Password</label>
        <input type="password" id="suConfirm" placeholder="Re-enter password" autocomplete="new-password">
        <div class="auth-err" id="confirmErr"></div>
      </div>
      <button type="submit" class="auth-submit"><span id="submitLabel">Create Account</span></button>
    </form>

    <p class="auth-alt">Already have an account? <a href="login.html">Login</a></p>
    <a href="index.html" class="auth-back">← Back to website</a>
  </div>
</div>

<script>
  const $ = id => document.getElementById(id);
  const setErr = (errId, msg) => {
    const el = $(errId);
    el.textContent = msg || '';
    el.classList.toggle('show', !!msg);
    return !msg;
  };

  $('suPhone').addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g, ''); });

  $('signupForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = $('suName').value.trim();
    const email = $('suEmail').value.trim().toLowerCase();
    const phone = $('suPhone').value.trim();
    const pass = $('suPass').value;
    const confirm = $('suConfirm').value;

    const results = [
      setErr('nameErr',    /^[A-Za-z ]{2,30}$/.test(name) ? '' : 'Enter a valid name (letters only)'),
      setErr('emailErr',   /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) ? '' : 'Enter a valid email address'),
      setErr('phoneErr',   /^[6-9][0-9]{9}$/.test(phone) ? '' : 'Enter a valid 10-digit Indian mobile number'),
      setErr('passErr',    pass.length >= 6 ? '' : 'Password must be at least 6 characters'),
      setErr('confirmErr', pass === confirm ? '' : 'Passwords do not match')
    ];
    if (results.includes(false)) return;

    // Demo storage only — replace with a real backend call in production
    try {
      const users = JSON.parse(localStorage.getItem('stackly_users') || '[]');
      if (users.some(u => u.email === email)) {
        setErr('emailErr', 'An account with this email already exists');
        return;
      }
      users.push({ name, email, phone, role: 'client', created: Date.now() });
      localStorage.setItem('stackly_users', JSON.stringify(users));
      localStorage.setItem('stackly_loginId', email);
      localStorage.setItem('stackly_role', 'client');
    } catch (err) {}

    $('submitLabel').textContent = 'Account created ✦';
    setTimeout(() => { window.location.href = 'dashboard-client.html'; }, 900);
  });
</script>
</body>
</html>
